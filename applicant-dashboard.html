<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hairlux — My Application</title>
<style>
@font-face {
  font-family: 'Bdogrotesk Vf';
  src: url("https://cdn.prod.website-files.com/675c8e48ca0e0fb5ab421239/675c8e48ca0e0fb5ab421302_BDOGrotesk-VF.ttf") format("truetype");
  font-weight: 300 900;
  font-style: normal;
  font-display: swap;
}
:root{
  /* Page canvas is a soft off-white; cards/sidebar/topbar sit one step up at pure white */
  --dark:#FAFAFA;--dark2:#FFFFFF;--dark3:#161616;--dark4:#262626;
  --gold:#9D8248;--gold2:#C2A06A;--gold-bg:rgba(157,130,72,.10);
  --white:#0F0F0F;--off:#F7F7F7;--border:#E4E4E4;--border2:rgba(15,15,15,.05);
  --text:#1A1A1A;--muted:#8A8A8A;--light:#4D4D4D;
  --green:#27AE60;--green2:rgba(39,174,96,.10);
  --red:#E74C3C;--red2:rgba(231,76,60,.10);
  --amber:#B8790A;--amber2:rgba(184,121,10,.10);
  --blue:#2E86DE;--blue2:rgba(46,134,222,.10);
  --purple:#8E44AD;--teal:#16A085;
  --sidebar:250px;--r:12px;--r2:8px;--r3:4px;
  --sh:0 2px 16px rgba(15,15,15,.06);--sh2:0 10px 28px rgba(15,15,15,.10);
  /* Fixed-role tokens: these surfaces stay dark/gold regardless of theme, so
     they need their own text colors rather than the page's --white/--muted */
  --ink:#0F0F0F;
  --on-dark-title:#FFFFFF;--on-dark-text:rgba(255,255,255,.62);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Bdogrotesk Vf','Inter',system-ui,sans-serif;font-size:14px;background:var(--dark);color:var(--text);display:flex;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);background:var(--dark2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0}
.sb-top{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.sb-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sb-logo{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--ink);flex-shrink:0}
.sb-brand-name{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.sb-brand-sub{font-size:9px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.staff-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink);flex-shrink:0}
.av.sm{width:26px;height:26px;font-size:10px}
.av.lg{width:54px;height:54px;font-size:20px}
.av.xl{width:80px;height:80px;font-size:28px}
.av.blue{background:linear-gradient(135deg,var(--blue),#1a5fb0)}
.av.purple{background:linear-gradient(135deg,var(--purple),#6c3483)}
.av.green{background:linear-gradient(135deg,var(--green),#1e8449)}
.av.teal{background:linear-gradient(135deg,var(--teal),#0e6655)}
.chip-name{font-size:12px;font-weight:700;color:var(--white)}
.chip-role{font-size:10px;color:var(--muted)}
.chip-id{font-size:9px;color:var(--gold);font-family:monospace;margin-top:2px}
.sb-sec{padding:16px 16px 5px;font-size:9px;font-weight:700;color:rgba(130,148,165,.45);letter-spacing:.12em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:var(--r2);color:var(--muted);cursor:pointer;transition:.18s;font-size:13px;font-weight:500;position:relative;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.05);color:var(--light)}
.sb-item.active{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(157,130,72,.2)}
.sb-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-item .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:9px;line-height:1.5}
.sb-item .bdg.amber{background:var(--amber)}
.sb-item .bdg.gold{background:var(--gold);color:var(--ink)}
.sb-footer{margin-top:auto;border-top:1px solid var(--border);padding:16px}
.sb-logout{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r2);cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;transition:.18s}
.sb-logout:hover{background:var(--red2);color:var(--red)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── TOPBAR ── */
.topbar{height:64px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0}
.tb-left h1{font-size:17px;font-weight:800;color:var(--white)}
.bc{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ico-btn{width:36px;height:36px;border-radius:var(--r2);border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:16px;transition:.18s;position:relative}
.ico-btn:hover{background:rgba(255,255,255,.06);color:var(--light)}
.ndot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--dark2)}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:26px 28px;background:var(--dark)}
.screen{display:none}.screen.active{display:block}

/* ── GRID ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.flex{display:flex}.aic{align-items:center}.jsb{justify-content:space-between}
.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}

/* ── CARD ── */
.card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:14px;font-weight:700;color:var(--white)}
.card-b{padding:20px 22px}

/* ── STAT ── */
.stat{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:.2s;cursor:default}
.stat:hover{border-color:rgba(157,130,72,.3);transform:translateY(-2px);box-shadow:var(--sh2)}
.stat-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
.stat-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat-val{font-size:28px;font-weight:800;color:var(--white);line-height:1;margin:6px 0 4px}
.stat-delta{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.up{color:var(--green)}.down{color:var(--red)}.neu{color:var(--muted)}
.stat::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.07}
.stat.gold::after{background:var(--gold)}.stat.green::after{background:var(--green)}
.stat.blue::after{background:var(--blue)}.stat.purple::after{background:var(--purple)}
.stat.amber::after{background:var(--amber)}.stat.teal::after{background:var(--teal)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.b-green{background:var(--green2);color:var(--green)}
.b-red{background:var(--red2);color:var(--red)}
.b-amber{background:var(--amber2);color:var(--amber)}
.b-blue{background:var(--blue2);color:var(--blue)}
.b-gold{background:var(--gold-bg);color:var(--gold)}
.b-purple{background:rgba(142,68,173,.12);color:var(--purple)}
.b-teal{background:rgba(22,160,133,.12);color:var(--teal)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r2);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.18s;font-family:inherit;text-decoration:none;letter-spacing:.01em}
.btn-gold{background:linear-gradient(135deg,var(--gold),#8a7040);color:var(--ink)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 18px rgba(157,130,72,.3)}
.btn-dark{background:rgba(255,255,255,.07);color:var(--light);border:1px solid var(--border)}
.btn-dark:hover{background:rgba(255,255,255,.11)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--light);border-color:rgba(255,255,255,.2)}
.btn-success{background:var(--green2);color:var(--green);border:1px solid rgba(39,174,96,.25)}
.btn-danger{background:var(--red2);color:var(--red);border:1px solid rgba(231,76,60,.25)}
.btn-sm{padding:5px 12px;font-size:11px}

/* ── FORM ── */
.form-group{margin-bottom:16px}
.label{display:block;font-size:11px;font-weight:700;color:var(--light);margin-bottom:6px;letter-spacing:.02em}
.req{color:var(--red)}
.input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r2);font-size:13px;color:var(--text);background:rgba(255,255,255,.04);transition:.18s;outline:none;font-family:inherit}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(157,130,72,.1)}
.input::placeholder{color:rgba(130,148,165,.4)}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}
select.input{cursor:pointer}
.helper{font-size:11px;color:var(--muted);margin-top:4px}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:rgba(255,255,255,.03);border-bottom:2px solid var(--border)}
th{padding:11px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:none}

/* ── STATUS TRACKER ── */
.st-steps{display:flex;flex-direction:column}
.st-step{display:flex;gap:14px;position:relative}
.st-step::before{content:'';position:absolute;left:15px;top:34px;bottom:-8px;width:2px;background:var(--border)}
.st-step:last-child::before{display:none}
.st-circle{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;z-index:1;border:2px solid var(--border);color:var(--muted);background:var(--dark2)}
.st-step.done .st-circle{background:var(--green);border-color:var(--green);color:#fff}
.st-step.cur .st-circle{background:var(--gold);border-color:var(--gold);color:var(--ink);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(157,130,72,.4)}50%{box-shadow:0 0 0 8px rgba(157,130,72,.0)}}
.st-body{padding-bottom:22px}
.st-title{font-size:13px;font-weight:700;color:var(--light);padding-top:5px}
.st-date{font-size:11px;color:var(--muted);margin-top:2px}
.st-note{font-size:12px;color:var(--muted);margin-top:8px;background:rgba(255,255,255,.04);border-radius:var(--r2);padding:10px 12px;border-left:3px solid var(--gold);line-height:1.5}

/* ── AGREEMENT ── */
.ag-item{display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:var(--r2);border:1.5px solid var(--border);margin-bottom:10px;transition:.2s;cursor:pointer}
.ag-item:hover{border-color:rgba(255,255,255,.15)}
.ag-item.done{border-color:rgba(39,174,96,.3);background:rgba(39,174,96,.04)}
.ag-item.cur{border-color:rgba(157,130,72,.4);background:rgba(157,130,72,.06)}
.ag-chk{width:22px;height:22px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:2px}
.ag-item.done .ag-chk{background:var(--green);color:#fff}
.ag-item.cur .ag-chk{border:2px solid var(--gold);background:rgba(157,130,72,.1)}
.ag-item.pend .ag-chk{border:2px solid var(--border)}
.ag-title{font-size:13px;font-weight:700;color:var(--white)}
.ag-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}

/* ── NOTIFICATION ── */
.notif{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s}
.notif:hover{background:rgba(255,255,255,.025)}
.notif.unread{background:rgba(157,130,72,.03)}
.ndot2{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:5px}
.ndot2.read{background:transparent;border:1.5px solid var(--border)}
.n-t{font-size:13px;font-weight:600;color:var(--white)}
.n-b{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.n-d{font-size:10px;color:rgba(130,148,165,.55);margin-top:3px}

/* ── ANNOUNCE BANNER ── */
.banner{background:linear-gradient(135deg,var(--dark3),var(--dark4));border:1px solid var(--border);border-radius:var(--r);padding:22px;position:relative;overflow:hidden;margin-bottom:14px}
.banner::after{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;background:rgba(157,130,72,.08)}
.banner .tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.banner h3{font-size:15px;font-weight:800;color:var(--on-dark-title);margin-bottom:6px}
.banner p{font-size:12px;color:var(--on-dark-text);line-height:1.5}
.banner .meta{font-size:11px;color:var(--gold);margin-top:12px;font-weight:600}
.banner.urgent{border-color:rgba(231,76,60,.3);background:linear-gradient(135deg,rgba(231,76,60,.08),rgba(22,22,22,.95))}
.banner.urgent::after{background:rgba(231,76,60,.1)}

/* ── TASK ── */
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:var(--r2);border:1px solid var(--border);margin-bottom:8px;transition:.18s;background:rgba(255,255,255,.02)}
.task:hover{border-color:rgba(255,255,255,.12)}
.task.urgent{border-color:rgba(231,76,60,.3);background:rgba(231,76,60,.04)}
.task.done{opacity:.5}
.task-chk{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;margin-top:1px;transition:.18s;display:flex;align-items:center;justify-content:center;font-size:10px}
.task-chk:hover{border-color:var(--gold)}
.task-chk.checked{background:var(--green);border-color:var(--green);color:#fff}
.task-title{font-size:13px;font-weight:600;color:var(--light)}
.task-due{font-size:10px;color:var(--muted);margin-top:2px}
.task.urgent .task-title{color:var(--red)}

/* ── CHECKIN BUTTON ── */
.ci-btn{width:110px;height:110px;border-radius:50%;background:rgba(157,130,72,.1);border:3px solid var(--gold);color:var(--gold);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;transition:.2s;user-select:none}
.ci-btn:hover{background:rgba(157,130,72,.2);transform:scale(1.04)}
.ci-btn.active{background:rgba(39,174,96,.12);border-color:var(--green);color:var(--green)}

/* ── WEEK DOTS ── */
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wd .day{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.wd .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wd .dot.ok{background:var(--green);color:#fff}
.wd .dot.late{background:var(--amber);color:#fff}
.wd .dot.absent{background:rgba(231,76,60,.2);color:var(--red)}
.wd .dot.today{background:var(--dark4);border:2px solid var(--gold);color:var(--gold)}
.wd .dot.off{background:rgba(255,255,255,.05);color:var(--muted);border:1.5px dashed var(--border)}

/* ── PROGRESS BAR ── */
.pbar{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin:6px 0}
.pbar span{display:block;height:100%;border-radius:4px;background:var(--gold);transition:width .5s}
.pbar.green span{background:var(--green)}
.pbar.red span{background:var(--red)}
.pbar.amber span{background:var(--amber)}

/* ── INVENTORY ── */
.inv-bar{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:12px}
.inv-name{flex:1;color:var(--light);font-weight:500}
.inv-fill{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.inv-fill span{display:block;height:100%;border-radius:3px;background:var(--green)}
.inv-fill.lo span{background:var(--red)}
.inv-fill.md span{background:var(--amber)}

/* ── PROFILE HERO ── */
.prof-hero{background:linear-gradient(135deg,var(--dark3) 0%,var(--dark2) 100%);padding:32px 28px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border)}
.prof-hero-info .name{font-size:22px;font-weight:800;color:var(--white)}
.prof-hero-info .role{font-size:13px;color:var(--gold);margin-top:4px;font-weight:600}
.prof-hero-info .id{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace;letter-spacing:.06em}
.prof-stats{display:flex;gap:28px;margin-top:18px}
.ps{text-align:center}
.ps .val{font-size:20px;font-weight:800;color:var(--white)}
.ps .lbl{font-size:10px;color:var(--muted);margin-top:2px}

/* ── INFO GRID ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-item .lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.info-item .val{font-size:13px;color:var(--light);margin-top:3px;font-weight:500}

/* ── UPLOAD ── */
.upload{border:2px dashed var(--border);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02)}
.upload:hover{border-color:var(--gold);background:rgba(157,130,72,.04)}

/* ── STEPS ── */
.steps{display:flex;align-items:center;margin-bottom:28px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step-c{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.step.done .step-c{background:var(--green);color:#fff}
.step.act .step-c{background:var(--gold);color:var(--ink)}
.step.pend .step-c{background:rgba(255,255,255,.07);color:var(--muted);border:2px solid var(--border)}
.step-lbl{font-size:11px;font-weight:600}
.step.act .step-lbl{color:var(--white)}.step.done .step-lbl{color:var(--green)}.step.pend .step-lbl{color:var(--muted)}
.step-line{flex:1;height:2px;background:var(--border)}
.step.done .step-line,.step.done+.step .step-line{background:var(--green)}

/* ── CAREER ── */
.chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:.18s;white-space:nowrap;font-family:inherit}
.chip:hover,.chip.active{border-color:var(--gold);background:rgba(157,130,72,.12);color:var(--gold)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#c2c2c2}

/* ── This is a standalone page, not the sidebar app the shared stylesheet
   above was written for — body{display:flex} was meant to lay a sidebar
   and main content side by side. With no sidebar here, that made
   #screen-track shrink to its content width and hug the left edge
   instead of filling the viewport (which is why max-width+margin:auto
   inside it wasn't actually centering anything). Restore normal block
   flow for this page specifically. ── */
body{display:block;overflow-x:hidden;overflow-y:auto}

/* ── Responsive ── */
@media (max-width: 860px){
  .track-content{padding:20px 16px}
  .g2{grid-template-columns:1fr}
}
@media (max-width: 640px){
  .track-header{padding:12px 16px;flex-wrap:wrap;gap:10px}
  .info-grid{grid-template-columns:1fr}
  .banner{padding:16px}
}
</style>
</head>

<body>

<div id="screen-track" style="min-height:100vh;display:flex;flex-direction:column;background:var(--dark)">
  <div class="track-header" style="background:var(--dark2);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between">
    <div class="flex aic gap3"><div class="av" id="track-avatar">--</div><div><div style="color:var(--white);font-weight:700;font-size:14px" id="track-applicant-name">Loading…</div><div style="color:var(--muted);font-size:11px" id="track-applicant-ref">Applicant Portal</div></div></div>
    <div class="flex gap2"><span class="badge" id="track-header-badge" style="display:none"></span><button class="btn btn-ghost btn-sm" onclick="handleSignOut()">Sign Out</button></div>
  </div>
  <div class="track-content" style="max-width:820px;margin:0 auto;padding:28px 20px;width:100%">
    <div id="track-body">
      <div class="card"><div class="card-b" style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">Loading your application…</div></div>
    </div>
  </div>
</div>


<script src="assets/js/config.js"></script>
<script src="assets/js/applicant-api.js"></script>
<script>
  function handleSignOut() {
    ApplicantAPI.logout();
    window.location.href = 'log-in.html';
  }

  var STATUS_ORDER = ['SUBMITTED', 'UNDER_REVIEW', 'SHORTLISTED', 'INTERVIEW_SCHEDULED', 'INTERVIEW_COMPLETED', 'OFFER_EXTENDED', 'EMPLOYED'];
  var STATUS_LABELS = {
    SUBMITTED: 'Application Submitted',
    UNDER_REVIEW: 'Under Review',
    SHORTLISTED: 'Shortlisted',
    INTERVIEW_SCHEDULED: 'Interview Scheduled',
    INTERVIEW_COMPLETED: 'Interview Completed',
    OFFER_EXTENDED: 'Offer Extended',
    EMPLOYED: 'Employed',
    NOT_SELECTED: 'Not Selected',
  };
  var STATUS_BADGE_CLASS = {
    SUBMITTED: 'b-blue',
    UNDER_REVIEW: 'b-amber',
    SHORTLISTED: 'b-teal',
    INTERVIEW_SCHEDULED: 'b-gold',
    INTERVIEW_COMPLETED: 'b-purple',
    OFFER_EXTENDED: 'b-green',
    EMPLOYED: 'b-green',
    NOT_SELECTED: 'b-red',
  };

  function initials(firstName, lastName) {
    return ((firstName || '').charAt(0) + (lastName || '').charAt(0)).toUpperCase() || '--';
  }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function renderTimeline(app) {
    if (app.status === 'NOT_SELECTED') {
      return '<div class="card"><div class="card-h"><h3>Application Status</h3><span class="badge b-red">Not Selected</span></div>' +
        '<div class="card-b">' +
        '<p style="color:var(--text);font-size:13px;line-height:1.6;margin-bottom:10px">Thank you for applying to Hairlux. After careful review, we won\'t be moving forward with this application at this time.</p>' +
        (app.notSelectedReason ? '<p style="color:var(--muted);font-size:12px;line-height:1.6"><strong style="color:var(--text)">Note:</strong> ' + escapeHtml(app.notSelectedReason) + '</p>' : '') +
        '<a href="careers.html" class="btn btn-gold" style="width:100%;margin-top:16px;display:block;text-align:center;text-decoration:none">Browse Open Roles →</a>' +
        '</div></div>';
    }

    var currentIndex = STATUS_ORDER.indexOf(app.status);
    var steps = STATUS_ORDER.map(function (statusKey, i) {
      var cls = i < currentIndex ? 'done' : (i === currentIndex ? 'cur' : '');
      var circle = i < currentIndex ? '✓' : String(i + 1);
      var dateLine = '';
      if (statusKey === 'SUBMITTED' && app.createdAt) {
        dateLine = '<div class="st-date">' + formatDateTime(app.createdAt) + '</div>';
      } else if (statusKey === 'INTERVIEW_SCHEDULED' && app.interviewScheduledAt) {
        dateLine = '<div class="st-date">' + formatDateTime(app.interviewScheduledAt) + '</div>';
      } else if (i < currentIndex) {
        dateLine = '<div class="st-date">Completed</div>';
      } else if (i > currentIndex) {
        dateLine = '<div class="st-date">Awaiting</div>';
      }
      return '<div class="st-step ' + cls + '"><div class="st-circle">' + circle + '</div>' +
        '<div class="st-body"><div class="st-title">' + STATUS_LABELS[statusKey] + '</div>' + dateLine + '</div></div>';
    }).join('');

    return '<div class="card"><div class="card-h"><h3>Application Status</h3>' +
      '<span class="badge ' + (STATUS_BADGE_CLASS[app.status] || 'b-blue') + '">' + (STATUS_LABELS[app.status] || app.status) + '</span></div>' +
      '<div class="card-b"><div class="st-steps">' + steps + '</div></div></div>';
  }

  function renderBanner(app) {
    if (app.status !== 'INTERVIEW_SCHEDULED' || !app.interviewScheduledAt) return '';
    return '<div class="banner mb4">' +
      '<div class="tag">📅 Interview Scheduled</div>' +
      '<h3>You have an interview on ' + formatDate(app.interviewScheduledAt) + '</h3>' +
      '<p>' + escapeHtml(app.appliedRole || 'Your applied role') + '</p>' +
      '<div class="meta">' +
      formatDateTime(app.interviewScheduledAt).split(' · ')[1] +
      (app.interviewMode === 'VIRTUAL' ? (app.interviewMeetingUrl ? ' · <a href="' + app.interviewMeetingUrl + '" target="_blank" rel="noopener noreferrer" style="color:inherit">Join Meeting</a>' : '')
      : (app.interviewLocationName ? ' · ' + escapeHtml(app.interviewLocationName) : '')) +
      (app.interviewerName ? ' · Interviewer: ' + escapeHtml(app.interviewerName) : '') +
      '</div>' +
      (app.interviewNote ? '<div class="meta" style="margin-top:4px">' + escapeHtml(app.interviewNote) + '</div>' : '') +
      '</div>';
  }

  function renderDetails(app) {
    return '<div class="card"><div class="card-h"><h3>Application Details</h3></div><div class="card-b">' +
      '<div class="info-grid">' +
        '<div class="info-item"><div class="lbl">Position</div><div class="val">' + escapeHtml(app.appliedRole || '—') + '</div></div>' +
        '<div class="info-item"><div class="lbl">Branch</div><div class="val">' + escapeHtml(app.preferredBranchText || '—') + '</div></div>' +
        '<div class="info-item"><div class="lbl">Applied</div><div class="val">' + formatDate(app.createdAt) + '</div></div>' +
        '<div class="info-item"><div class="lbl">Reference</div><div class="val" style="font-family:monospace;font-size:11px">' + escapeHtml(app.applicationCode) + '</div></div>' +
      '</div></div></div>';
  }

  function render(app) {
    document.getElementById('track-avatar').textContent = initials(app.firstName, app.lastName);
    document.getElementById('track-applicant-name').textContent = [app.firstName, app.lastName].filter(Boolean).join(' ') || 'Applicant';
    document.getElementById('track-applicant-ref').textContent = 'Applicant Portal · Ref: ' + app.applicationCode;

    var headerBadge = document.getElementById('track-header-badge');
    headerBadge.textContent = STATUS_LABELS[app.status] || app.status;
    headerBadge.className = 'badge ' + (STATUS_BADGE_CLASS[app.status] || 'b-blue');
    headerBadge.style.display = 'inline-flex';

    var body = document.getElementById('track-body');
    if (app.status === 'NOT_SELECTED') {
      body.innerHTML = renderTimeline(app);
      return;
    }

    var employedCta = app.status === 'EMPLOYED'
      ? '<div style="text-align:center;padding:16px"><button class="btn btn-gold" onclick="window.location.href=\'log-in.html\'" style="width:100%">Go to Staff Login →</button></div>'
      : '';

    body.innerHTML = renderBanner(app) +
      '<div class="g2">' +
        renderTimeline(app) +
        '<div style="display:flex;flex-direction:column;gap:14px">' + renderDetails(app) + employedCta + '</div>' +
      '</div>';
  }

  function renderError(message) {
    document.getElementById('track-body').innerHTML =
      '<div class="card"><div class="card-b" style="text-align:center;padding:40px 20px">' +
      '<p style="color:var(--text);font-size:13px;margin-bottom:14px">' + escapeHtml(message) + '</p>' +
      '<button class="btn btn-ghost" onclick="location.reload()">Try Again</button>' +
      '</div></div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!ApplicantAPI.isAuthenticated()) {
      window.location.href = 'log-in.html';
      return;
    }

    ApplicantAPI.getMe()
      .then(function (res) {
        render(res.data);
      })
      .catch(function (err) {
        if (err && (err.status === 401 || err.status === 403)) {
          ApplicantAPI.logout();
          window.location.href = 'log-in.html';
          return;
        }
        renderError((err && err.message) || 'Could not load your application right now.');
      });
  });
</script>
</body>
</html>
