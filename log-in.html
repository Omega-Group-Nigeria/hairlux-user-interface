    body {

    .login-brand-logo {

    .password-field-wrap {
      position: relative;
      width: 100%;
    }

    .password-toggle-btn {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #5b6672;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #8a8a8a;
      font-size: 13px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e4e4e4;
    }

    #hl-google-btn-container {
      display: flex;
      justify-content: center;
    }
  
[data-theme="dark"] .password-toggle-btn { color: #a7adb8; }
[data-theme="dark"] .auth-divider { color: #a7adb8; }
[data-theme="dark"] .auth-divider::before,
[data-theme="dark"] .auth-divider::after { background: #30353f; }

    /* OTP Modal (matches sign-up.html's implementation) */
    #hl-otp-modal.hl-otp-open {
      display: flex;
    }

    .hl-otp-box {
      background: #fff;
      border-radius: 18px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .18);
      text-align: center;
      animation: hlOtpIn .2s ease;
    }

    @keyframes hlOtpIn {
      from {
        opacity: 0;
        transform: scale(.94) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .hl-otp-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      line-height: 1;
      padding: 4px;
      font-size: 20px;
      transition: color .15s;
    }

    .hl-otp-close:hover {
      color: #222;
    }

    .hl-otp-icon {
      width: 56px;
      height: 56px;
      background: #f0f5ea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .hl-otp-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .hl-otp-sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .hl-otp-sub strong {
      color: #222;
    }

    .hl-otp-input {
      width: 100%;
      text-align: center;
      font-size: 28px;
      letter-spacing: 12px;
      font-weight: 700;
      border: 1px solid #d0d8c8;
      border-radius: 999px;
      padding: 14px 10px;
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
    }

    .hl-otp-input:focus {
      border-color: #9d8248;
    }

    .hl-otp-verify-btn {
      z-index: 5;
      margin-top: 18px;
      background-color: var(--dark-gray);
      color: var(--gray-30);
      text-align: center;
      white-space: nowrap;
      border-radius: 100px;
      justify-content: center;
      align-items: center;
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background-color .2s;
      display: flex;
      position: relative;
      width: 100%;
    }

    .hl-otp-verify-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .hl-otp-verify-btn:not(:disabled):hover {
      background: #334420;
    }

    .hl-otp-resend-row {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
    }

    .hl-otp-resend-btn {
      background: none;
      border: none;
      color: #9d8248;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      transition: color .15s;
    }

    .hl-otp-resend-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }

    .hl-otp-msg {
      margin-top: 12px;
      font-size: 13px;
      border-radius: 7px;
      padding: 9px 12px;
      display: none;
    }

    .hl-otp-msg.success {
      background: #eaf4e4;
      color: #2d6a1f;
      display: block;
    }

    .hl-otp-msg.error {
      background: #fdecea;
      color: #b71c1c;
      display: block;
    }

[data-theme="dark"] .hl-otp-box { background: #1c2027; }
[data-theme="dark"] .hl-otp-close { color: #a7adb8; }
[data-theme="dark"] .hl-otp-close:hover { color: #f0ede6; }
[data-theme="dark"] .hl-otp-icon { background: rgba(157, 130, 72, .16); }
[data-theme="dark"] .hl-otp-sub { color: #a7adb8; }
[data-theme="dark"] .hl-otp-sub strong { color: #f0ede6; }
[data-theme="dark"] .hl-otp-input { background: #20242c; color: #f0ede6; border-color: #30353f; }
[data-theme="dark"] .hl-otp-resend-row { color: #a7adb8; }
[data-theme="dark"] .hl-otp-resend-btn:disabled { color: #6c7280; }
[data-theme="dark"] .hl-otp-msg.success { background: rgba(26, 110, 56, .22); color: #7fd89c; }
[data-theme="dark"] .hl-otp-msg.error { background: rgba(192, 57, 43, .22); color: #ff8a80; }
